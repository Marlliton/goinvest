blocks:
  cotacao:       {label: "Cotação",       order: 1}
  valuation:     {label: "Valuation",     order: 2}
  rentabilidade: {label: "Rentabilidade", order: 3}
  endividamento: {label: "Endividamento", order: 4}
  dividendos:    {label: "Dividendos",    order: 5}

metrics:
  # Bloco Cotação
  - id: cotacao
    label: "Cotação"
    block: cotacao
    order: 1
    unit: brl
    classes: [acao, fii]

  - id: liq_2meses
    label: "Liquidez 2 meses"
    block: cotacao
    order: 2
    unit: brl
    classes: [acao]

  - id: liquidez_fii
    label: "Liquidez"
    block: cotacao
    order: 3
    unit: brl
    classes: [fii]

  # Bloco Valuation
  - id: pl
    label: "P/L"
    block: valuation
    order: 1
    unit: ratio
    classes: [acao]
    percentile: true
    distribution_excludes_negative: true

  - id: pvp
    label: "P/VP"
    block: valuation
    order: 2
    unit: ratio
    classes: [acao, fii]
    percentile: true
    distribution_excludes_negative: true
    negative_equity_check: true
    not_applicable:
      ativo: "Patrimônio líquido negativo: o índice compararia preço com um patrimônio que não existe"

  - id: psr
    label: "PSR"
    block: valuation
    order: 3
    unit: ratio
    classes: [acao]
    percentile: true
    not_applicable:
      setor: "Banco: a receita vem de juros e serviços, não de vendas, e a fonte não apura receita líquida comparável para instituição financeira"
    sentinel_segments: ["Bancos"]

  - id: p_ativo
    label: "P/Ativo"
    block: valuation
    order: 4
    unit: ratio
    classes: [acao]
    percentile: true
    not_applicable:
      setor: "Banco: o ativo é a matéria-prima do negócio e é contabilizado por regras próprias das instituições financeiras, fora da régua do resto do mercado"
    sentinel_segments: ["Bancos"]

  - id: p_cap_giro
    label: "P/Cap.Giro"
    block: valuation
    order: 5
    unit: ratio
    classes: [acao]
    percentile: true
    not_applicable:
      setor: "Banco: quase todo o balanço cai em circulante, então o capital de giro oscila muito e não mede reinvestimento"
    sentinel_segments: ["Bancos"]

  - id: p_ebit
    label: "P/EBIT"
    block: valuation
    order: 6
    unit: ratio
    classes: [acao]
    percentile: true
    not_applicable:
      setor: "Banco: juros pagos a depositantes são a maior despesa do negócio, e um resultado medido antes deles apagaria justamente o custo principal"
    sentinel_segments: ["Bancos"]

  - id: p_ativ_circ_liq
    label: "P/Ativ Circ.Líq"
    block: valuation
    order: 7
    unit: ratio
    classes: [acao]
    percentile: true
    not_applicable:
      setor: "Banco: quase todo o balanço cai em circulante, então o ativo circulante líquido não separa o que sobra do que é operação"
    sentinel_segments: ["Bancos"]

  - id: ev_ebit
    label: "EV/EBIT"
    block: valuation
    order: 8
    unit: ratio
    classes: [acao]
    percentile: true
    not_applicable:
      setor: "Banco: dívida é matéria-prima e não financiamento tomado, então o valor da firma — e todo múltiplo que parte dele — perde sentido"
    sentinel_segments: ["Bancos"]

  - id: ev_ebitda
    label: "EV/EBITDA"
    block: valuation
    order: 9
    unit: ratio
    classes: [acao]
    percentile: true
    not_applicable:
      setor: "Banco: dívida é matéria-prima e não financiamento tomado, então o valor da firma — e todo múltiplo que parte dele — perde sentido"
    sentinel_segments: ["Bancos"]

  - id: valor_mercado
    label: "Valor de Mercado"
    block: valuation
    order: 10
    unit: brl
    classes: [fii]

  - id: qtd_imoveis
    label: "Qtd. de Imóveis"
    block: valuation
    order: 11
    unit: count
    classes: [fii]

  - id: preco_m2
    label: "Preço por m²"
    block: valuation
    order: 12
    unit: brl
    classes: [fii]

  # Bloco Rentabilidade
  - id: mrg_bruta
    label: "Margem Bruta"
    block: rentabilidade
    order: 1
    unit: percent
    classes: [acao]
    percentile: true
    not_applicable:
      setor: "Banco: não há custo de produto vendido do qual sobre margem bruta; a demonstração de resultado de instituição financeira não tem essa linha"
    sentinel_segments: ["Bancos"]

  - id: mrg_ebit
    label: "Margem EBIT"
    block: rentabilidade
    order: 2
    unit: percent
    classes: [acao]
    percentile: true
    not_applicable:
      setor: "Banco: juros pagos a depositantes são a maior despesa do negócio, e um resultado medido antes deles apagaria justamente o custo principal"
    sentinel_segments: ["Bancos"]

  - id: mrg_liq
    label: "Margem Líquida"
    block: rentabilidade
    order: 3
    unit: percent
    classes: [acao]
    percentile: true
    not_applicable:
      setor: "Banco: a margem divide pela mesma receita líquida de vendas que a fonte não apura para instituição financeira"
    sentinel_segments: ["Bancos"]

  - id: roic
    label: "ROIC"
    block: rentabilidade
    order: 4
    unit: percent
    classes: [acao]
    percentile: true
    not_applicable:
      setor: "Banco: o índice parte do EBIT e do capital investido, e para instituição financeira o capital é só o patrimônio"
    sentinel_segments: ["Bancos"]

  - id: roe
    label: "ROE"
    block: rentabilidade
    order: 5
    unit: percent
    classes: [acao]
    percentile: true

  - id: roa
    label: "ROA"
    block: rentabilidade
    order: 6
    unit: percent
    classes: [acao]
    derived: true
    formula: "Lucro Líquido ÷ Ativo Total"
    inputs: [roe, p_ativo, pvp, patrim_liq]
    not_applicable:
      ativo: "Ativo total não derivável: P/Ativo ausente ou zero"

  - id: cresc_rec_5a
    label: "Crescimento Receita 5a"
    block: rentabilidade
    order: 7
    unit: percent
    classes: [acao]
    percentile: true

  - id: aluguel_m2
    label: "Aluguel por m²"
    block: rentabilidade
    order: 8
    unit: brl
    classes: [fii]

  - id: cap_rate
    label: "Cap Rate"
    block: rentabilidade
    order: 9
    unit: percent
    classes: [fii]
    percentile: true

  - id: vacancia_media
    label: "Vacância Média"
    block: rentabilidade
    order: 10
    unit: percent
    classes: [fii]
    percentile: true

  # Bloco Endividamento
  - id: liq_corr
    label: "Liquidez Corrente"
    block: endividamento
    order: 1
    unit: ratio
    classes: [acao]
    percentile: true
    not_applicable:
      setor: "Banco: quase todo o balanço cai em circulante dos dois lados, então a razão entre eles não mede folga de caixa"
    sentinel_segments: ["Bancos"]

  - id: patrim_liq
    label: "Patrimônio Líquido"
    block: endividamento
    order: 2
    unit: brl
    classes: [acao]

  - id: dl_patrim
    label: "Dív.Líq/Patrimônio"
    block: endividamento
    order: 3
    unit: ratio
    classes: [acao]
    percentile: true
    not_applicable:
      setor: "Banco: depósito de cliente e dívida se confundem no balanço, então não há dívida líquida definível para dividir pelo patrimônio"
    sentinel_segments: ["Bancos"]

  - id: dl_ebitda
    label: "Dív.Líq./EBITDA"
    block: endividamento
    order: 4
    unit: ratio
    classes: [acao]
    derived: true
    formula: "Dívida Líquida ÷ EBITDA"
    inputs: [pvp, patrim_liq, dl_patrim, ev_ebitda]
    not_applicable:
      ativo: "EBITDA negativo ou zero: não há geração de caixa para quitar a dívida, e o índice se leria como caixa líquido"

  # Bloco Dividendos
  - id: dy
    label: "Dividend Yield"
    block: dividendos
    order: 1
    unit: percent
    classes: [acao, fii]
    percentile: true

  - id: ffo_yield
    label: "FFO Yield"
    block: dividendos
    order: 2
    unit: percent
    classes: [fii]
    percentile: true

  - id: payout
    label: "Payout"
    block: dividendos
    order: 3
    unit: percent
    classes: [acao]
    derived: true
    formula: "DY × P/L"
    inputs: [dy, pl]
    not_applicable:
      ativo: "Prejuízo no período: não há lucro do qual o dividendo seja uma fatia"

  - id: lucro_liquido
    label: "Lucro Líquido (12m)"
    block: rentabilidade
    order: 11
    unit: brl
    classes: [acao]

  - id: ebit
    label: "EBIT (12m)"
    block: rentabilidade
    order: 12
    unit: brl
    classes: [acao]
    not_applicable:
      setor: "Banco: dívida é matéria-prima do negócio, não financiamento tomado — o EBIT não é publicado para instituições financeiras nesta fonte"
    sentinel_segments: ["Bancos"]

  - id: rend_distribuido
    label: "Rend. Distribuído (12m)"
    block: dividendos
    order: 4
    unit: brl
    classes: [fii]

  - id: ffo
    label: "FFO (12m)"
    block: dividendos
    order: 5
    unit: brl
    classes: [fii]

  - id: venda_ativos
    label: "Venda de Ativos (12m)"
    block: dividendos
    order: 6
    unit: brl
    classes: [fii]

  - id: receita
    label: "Receita (12m)"
    block: dividendos
    order: 7
    unit: brl
    classes: [fii]
